name: Update hosts

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download domains list
        run: |
          curl -L \
            "https://github.com/bootmortis/iran-hosted-domains/releases/latest/download/domains.txt" \
            -o domains.txt

      - name: Convert to Pi-hole hosts format
        run: |
          awk 'NF {print "0.0.0.0 " $1}' domains.txt > hosts

      - name: Remove temporary file
        run: |
          rm domains.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hosts

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update hosts list"
            git push
          fi
